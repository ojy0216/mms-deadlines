name: Sync official conference schedules and deploy Pages
on:
  schedule:
    - cron: '0 15 * * *' # 00:00 KST (UTC+09:00), following day
  workflow_dispatch:
  push:
    branches: [gh-pages]
    paths-ignore:
      - 'docs/**'
      - 'AGENTS.md'

concurrency:
  group: conference-pages
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  sync-build-deploy:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: utils/requirements.txt
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.1'
          bundler-cache: true
      - name: Install collection dependencies
        run: pip install -r utils/requirements.txt
      - name: Collect official schedules
        run: python -m utils.collector.sync
      - name: Validate data and parsers
        run: |
          python -m utils.collector.sync --validate-only
          python -m unittest discover -s tests -v
      - uses: actions/configure-pages@v5
      - name: Build site
        run: bundle exec jekyll build --future
      - name: Validate generated JSON and calendars
        run: python -m utils.validate_site
      - name: Validate rendered HTML and internal links
        run: bundle exec htmlproofer ./_site --disable-external --check-favicon --check-html --url-swap '^/mms-deadlines/:/'
      - name: Commit validated data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add _data/conferences.yml _data/sync_status.yml
          if ! git diff --cached --quiet; then
            git commit -m 'Update official conference schedules'
            git push origin HEAD:${{ github.event.repository.default_branch }}
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy Pages
        id: deploy
        uses: actions/deploy-pages@v4
